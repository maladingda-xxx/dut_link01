services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dutlink
      POSTGRES_PASSWORD: dutlink
      POSTGRES_DB: dutlink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dutlink -d dutlink"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DUTLINK_DATABASE_URL: postgresql+asyncpg://dutlink:dutlink@postgres:5432/dutlink
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    environment:
      # Points the Vite dev-server proxy at the backend service on the compose network.
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
