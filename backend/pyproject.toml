[project]
name = "dut-link-backend"
version = "0.1.0"
description = "DUT Link backend service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "alembic>=1.19.1",
    "langgraph>=1.2.11",
    "openai>=3.3.1",
    "sentence-transformers>=6.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
